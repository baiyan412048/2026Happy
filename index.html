<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快樂航空｜電子機票</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.min.js" } }</script>
<script>
  // 背景主題：網址加 ?theme=lofi 或 ?theme=pink；再加 &webgl 改用 WebGL 即時雲；加 &fly 顯示 3D 飛機與飛機雲
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get("theme");
    if (t !== "lofi" && t !== "pink") return;
    var root = document.documentElement;
    root.dataset.theme = t;
    if (q.has("fly")) {
      root.dataset.fly = "1";
      // 3D 引擎、飛行程式與飛機模型在頁面一開始就同時下載，飛機才能一打開就飛出來
      [["modulepreload", "vendor/three/build/three.module.min.js"],
       ["modulepreload", "vendor/three/examples/jsm/loaders/GLTFLoader.js"],
       ["modulepreload", "vendor/three/examples/jsm/utils/BufferGeometryUtils.js"],
       ["modulepreload", "fly.js"],
       ["preload", "assets/models/a320.glb"]].forEach(function (x) {
        var l = document.createElement("link");
        l.rel = x[0]; l.href = x[1];
        if (x[0] === "preload") { l.as = "fetch"; l.crossOrigin = "anonymous"; }
        document.head.appendChild(l);
      });
    }
    if (q.has("webgl")) { root.dataset.gl = "1"; return; }
    // 普通版：雲層圖儘早開始下載，一打開就能顯示
    for (var i = 1; i <= 3; i++) {
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "image"; l.href = "assets/clouds/" + t + "-" + i + ".webp";
      document.head.appendChild(l);
    }
  })();
</script>
<style>
  :root {
    --ink: #16324F;        /* 海港深藍：文字 */
    --ink-soft: #4E6A85;
    --mist: #E6EFF3;       /* 霧藍底 */
    --paper: #FFFFFF;
    --coral: #E2566E;      /* 甘川珊瑚粉：重點色 */
    --sun: #F3C04F;        /* 芥末黃 */
    --teal: #2F9C95;
    --line: #C9D7E0;
    --display: "Bricolage Grotesque", "Noto Sans TC", sans-serif;
    --body: "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.65;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 6px; }

  .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* 頂部品牌 */
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 0;
    font-weight: 700; letter-spacing: .02em;
  }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand small { display: block; font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--ink-soft); letter-spacing: 0; line-height: 1.2; }
  .brand span { line-height: 1.2; }

  /* 查詢表單 */

  /* 訂位結果 */
  .booking { padding: 8px 0 56px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 500; font-size: 15px;
    color: var(--teal);
    margin-bottom: 4px;
  }
  .status svg { width: 18px; height: 18px; }

  /* 航線主視覺：整頁最大膽的地方 */
  .route { position: relative; margin: 8px 0 28px; }
  .route-codes {
    display: flex; justify-content: space-between; align-items: flex-end;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(64px, 22vw, 112px);
    line-height: .9;
    letter-spacing: -.03em;
  }
  .route-codes .to { color: var(--coral); }
  .route-cities {
    display: flex; justify-content: space-between;
    font-size: 15px; color: var(--ink-soft); margin-top: 8px;
  }
  .route-cities span:last-child { text-align: right; }
  .arc {
    display: block; width: 100%; height: auto;
    margin-bottom: 10px;
    overflow: visible;
  }
  .arc path.track { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 9; stroke-linecap: round; opacity: .45; }
  .arc .plane { fill: var(--ink); }

  /* 登機證 */
  /* 陰影用 drop-shadow，才會沿著挖空的缺口走 */
  .pass {
    filter: drop-shadow(0 1px 0 var(--line)) drop-shadow(0 14px 18px rgba(22, 50, 79, .14));
  }
  .pass-top, .stub { background: var(--paper); }
  .pass-top {
    border-radius: 18px 18px 0 0;
    overflow: hidden;
    padding-bottom: 20px;
    -webkit-mask:
      radial-gradient(circle at 0 100%, transparent 14px, #000 14.5px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 100%, transparent 14px, #000 14.5px) right / 51% 100% no-repeat;
            mask:
      radial-gradient(circle at 0 100%, transparent 14px, #000 14.5px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 100%, transparent 14px, #000 14.5px) right / 51% 100% no-repeat;
  }
  .pass-head {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--ink); color: var(--paper);
    padding: 14px 20px;
    font-size: 14px;
  }
  .pass-head strong { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: .04em; }
  .pass-body { padding: 20px 20px 8px; }
  .name { margin: 0 0 18px; }
  .name dt, .grid dt { font-size: 13px; color: var(--ink-soft); }
  .name dd { margin: 2px 0 0; font-size: 24px; font-weight: 700; line-height: 1.3; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px 12px; margin: 0;
  }
  .grid dd { margin: 2px 0 0; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .grid dd.zh { font-family: var(--body); font-size: 17px; font-weight: 700; line-height: 1.35; }
  .grid .wide { grid-column: span 3; }
  .seat dd { color: var(--coral); }

  .stub {
    position: relative;
    margin-top: -1px;
    border-radius: 0 0 18px 18px;
    -webkit-mask:
      radial-gradient(circle at 0 1px, transparent 14px, #000 14.5px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 1px, transparent 14px, #000 14.5px) right / 51% 100% no-repeat;
            mask:
      radial-gradient(circle at 0 1px, transparent 14px, #000 14.5px) left / 51% 100% no-repeat,
      radial-gradient(circle at 100% 1px, transparent 14px, #000 14.5px) right / 51% 100% no-repeat;
  }
  .stub::before {
    content: ""; position: absolute; top: 0; left: 24px; right: 24px;
    border-top: 2px dashed var(--line);
  }
  .stub { padding: 26px 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
  .stub-msg { margin: 0; font-size: 16px; line-height: 1.75; }
  .stub-msg .from { display: block; margin-top: 6px; font-size: 14px; color: var(--ink-soft); }
  .barcode { width: 100%; min-width: 92px; height: 64px; display: block; }
  .barcode rect { fill: var(--ink); }
  .code-text { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0; margin-top: 4px; text-align: justify; text-align-last: justify; white-space: nowrap; }

  /* 同行旅客 */
  .companion {
    margin-top: 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--paper);
    border-radius: 14px;
    padding: 16px 20px;
  }
  .companion .who { font-size: 13px; color: var(--ink-soft); }
  .companion .who b { display: block; font-size: 18px; color: var(--ink); }
  .companion .seat-mini { font-family: var(--display); font-weight: 600; font-size: 22px; }

  .notes { margin-top: 28px; font-size: 15px; color: var(--ink-soft); }
  .notes h2 { font-size: 17px; color: var(--ink); margin: 0 0 8px; }
  .notes ul { margin: 0; padding-left: 1.2em; }
  .notes li + li { margin-top: 4px; }

  footer { padding: 24px 0 40px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  /* ===== 進場動畫 =====
     每個元件 2 秒；標題組 0.5 秒後開始，登機證與下方內容 0.8 秒後開始；
     背景的雲與 3D 飛機不在此列，會一直持續。 */
  .brand, .status, .route-cities, .pass, .companion, .notes, footer {
    animation: enter-rise 2s cubic-bezier(.16, .84, .3, 1) both;
  }
  .arc { animation: enter-fade 2s ease-out both; }
  .route-codes span:first-child { display: inline-block; animation: enter-left 2s cubic-bezier(.16, .84, .3, 1) both; }
  .route-codes .to { display: inline-block; animation: enter-right 2s cubic-bezier(.16, .84, .3, 1) both; }
  /* 先標題（0.5 秒），再登機證與下方內容（0.8 秒） */
  .brand, .status, .arc, .route-codes span, .route-cities { animation-delay: .5s; }
  .pass, .companion, .notes, footer { animation-delay: .8s; }
  @keyframes enter-rise  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes enter-fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes enter-left  { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes enter-right { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .brand, .status, .arc, .route-codes span, .route-cities, .pass, .companion, .notes, footer { animation: none; }
  }
  @media (max-width: 440px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .grid .wide { grid-column: span 2; }
  }

  /* ===== 背景主題：?theme=lofi / ?theme=pink ===== */
  /* 背景固定在畫面上；高度用最大可視高度（lvh），Safari 工具列伸縮時不會跟著縮放而抖動 */
  .sky {
    display: none; position: fixed; top: 0; left: 0; z-index: 0;
    width: 100%; height: 100vh; height: 100lvh;
    pointer-events: none; overflow: hidden;
  }
  .wrap { position: relative; z-index: 1; }
  [data-theme] .sky { display: block; }

  /* 普通版：事先算好的三層雲層圖，一打開就顯示；遠慢近快水平飄動，加輕微上下浮動 */
  .cloud-layer {
    --tile: calc(150lvh + 36px);          /* 一張雲層圖的寬度（高的 1.5 倍），左右可無縫循環 */
    position: absolute; top: -12px; left: 0;
    height: calc(100% + 24px);
    width: calc(var(--tile) * 2);
    background-repeat: repeat-x;
    background-size: var(--tile) 100%;
    will-change: transform, translate;
    backface-visibility: hidden;
    animation:
      slide var(--dur) linear infinite,
      bob var(--bob) ease-in-out infinite alternate;
  }
  @supports not (height: 1lvh) { .cloud-layer { --tile: calc(150vh + 36px); } }
  .cloud-layer.l1 { --dur: 250s; --bob: 24s; }
  .cloud-layer.l2 { --dur: 180s; --bob: 20s; }
  .cloud-layer.l3 { --dur: 126s; --bob: 16s; }
  [data-theme="lofi"] .l1 { background-image: url(assets/clouds/lofi-1.webp); }
  [data-theme="lofi"] .l2 { background-image: url(assets/clouds/lofi-2.webp); }
  [data-theme="lofi"] .l3 { background-image: url(assets/clouds/lofi-3.webp); }
  [data-theme="pink"] .l1 { background-image: url(assets/clouds/pink-1.webp); }
  [data-theme="pink"] .l2 { background-image: url(assets/clouds/pink-2.webp); }
  [data-theme="pink"] .l3 { background-image: url(assets/clouds/pink-3.webp); }
  [data-gl] .cloud-layer { display: none; }
  @keyframes slide { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-50%, 0, 0); } }
  @keyframes bob { from { translate: 0 -8px; } to { translate: 0 8px; } }

  /* WebGL 版：即時渲染的雲 */
  .gl-sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 3D 飛機與飛機雲（&fly） */
  .fly-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* 有 3D 飛機時，隱藏標題上方的虛線弧線與小飛機（保留空間，版面位置不變） */
  [data-fly] .arc { visibility: hidden; }

  /* lofi：褪色藍天、底片顆粒與暗角 */
  [data-theme="lofi"] .sky { background: linear-gradient(180deg, #AFC9DA 0%, #C7D9E3 45%, #DFE7EB 100%); }
  .grain, .vignette { display: none; position: absolute; inset: 0; }
  [data-theme="lofi"] .grain, [data-theme="lofi"] .vignette { display: block; }
  .grain { transform: translateZ(0); }
  .vignette { background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(60, 80, 100, .18) 100%); }

  /* pink：粉色雲層 */
  [data-theme="pink"] { --coral: #C93A5C; }
  [data-theme="pink"] .sky { background: linear-gradient(180deg, #CFE1EE 0%, #DFE8F0 50%, #EDE6EE 100%); }

  @media (prefers-reduced-motion: reduce) {
    .cloud-layer { animation: none; }
  }
</style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true">
    <div class="cloud-layer l1"></div>
    <div class="cloud-layer l2"></div>
    <div class="cloud-layer l3"></div>
    <div class="grain" id="grain"></div>
    <div class="vignette"></div>
  </div>
  <div class="wrap">
    <header class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="19" fill="#E2566E"/>
        <circle cx="20" cy="17" r="7" fill="#F3C04F"/>
        <path d="M4 25c4-3 8-3 12 0s8 3 12 0 7-3 9-1v4a19 19 0 0 1-33 0z" fill="#16324F"/>
      </svg>
      <span>快樂航空<small>Happy Air</small></span>
    </header>

    <main>
      <section class="booking" id="booking" aria-labelledby="booking-title">
        <div class="status">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M6 10.5l2.6 2.6L14 7.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <div class="route" aria-label="從桃園國際機場飛往釜山金海國際機場">
          <svg class="arc" viewBox="0 0 400 70" aria-hidden="true">
            <path class="track" id="track" d="M40 56 Q200 -14 360 56"/>
            <g id="plane" class="plane">
              <path d="M14 0 L-1 -2.2 L-6 -9 L-8.5 -9 L-6 -2 L-10 -1.6 L-12.5 -4.5 L-14 -4.5 L-13 0 L-14 4.5 L-12.5 4.5 L-10 1.6 L-6 2 L-8.5 9 L-6 9 L-1 2.2 Z"/>
            </g>
          </svg>
          <div class="route-codes"><span>TPE</span><span class="to">PUS</span></div>
          <div class="route-cities"><span>台灣・桃園</span><span>韓國・釜山 金海</span></div>
        </div>

        <article class="pass" aria-label="登機證">
          <div class="pass-top">
          <div class="pass-head">
            <span>登機證</span>
            <strong id="flight-no"></strong>
          </div>
          <div class="pass-body">
            <dl class="name">
              <dt>旅客姓名</dt>
              <dd id="passenger"></dd>
            </dl>
            <dl class="grid">
              <div class="wide"><dt>出發日期</dt><dd class="zh" id="date"></dd></div>
              <div><dt>登機時間</dt><dd class="zh" id="boarding"></dd></div>
              <div><dt>登機門</dt><dd id="gate"></dd></div>
              <div class="seat"><dt>座位</dt><dd id="seat"></dd></div>
              <div><dt>艙等</dt><dd class="zh" id="cabin"></dd></div>
              <div><dt>飛行時間</dt><dd class="zh" id="duration"></dd></div>
              <div><dt>行李</dt><dd class="zh" id="baggage"></dd></div>
            </dl>
          </div>
          </div>
          <div class="stub">
            <p class="stub-msg"><span id="message"></span><span class="from" id="from"></span></p>
            <div>
              <svg class="barcode" id="barcode" viewBox="0 0 92 64" preserveAspectRatio="none" aria-hidden="true"></svg>
              <div class="code-text" id="code-text"></div>
            </div>
          </div>
        </article>

        <div class="companion">
          <div class="who">同行旅客<b id="companion"></b></div>
          <div class="seat-mini" id="companion-seat"></div>
        </div>

        <section class="notes">
          <h2>旅客須知</h2>
          <ul id="notes"></ul>

      </section>
    </main>

    <footer>© 2026 快樂航空 Happy Air</footer>
  </div>

<script>
  /* ===== 在這裡改成你們的資料 ===== */
  const CONFIG = {
    code: "HAPPY4EVER",           // 訂位代號（顯示在條碼下方）
    passenger: "WANG / XIAOMEI", // 旅客姓名
    companion: "CHEN / DAMING",  // 同行旅客姓名
    flight: "HA 520",
    date: "日期待定",
    boarding: "起飛前 40 分鐘",
    gate: "A1",
    seat: "5A",
    companionSeat: "5B",
    cabin: "經濟艙",
    duration: "約 2 小時 15 分",
    baggage: "托運 23 公斤",
    message: "感謝您選擇快樂航空，期待與您在釜山相見，祝您旅途愉快。",
    from: "快樂航空 敬上",
    notes: [
      "請於班機起飛前 2 小時抵達機場，辦理報到及行李托運手續。",
      "請攜帶效期六個月以上之有效護照。",
      "登機門將於班機起飛前 20 分鐘關閉，請準時登機。"
    ]
  };
  /* =============================== */

  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function fill() {
    $("flight-no").textContent = CONFIG.flight;
    $("passenger").textContent = CONFIG.passenger;
    $("date").textContent = CONFIG.date;
    $("boarding").textContent = CONFIG.boarding;
    $("gate").textContent = CONFIG.gate;
    $("seat").textContent = CONFIG.seat;
    $("cabin").textContent = CONFIG.cabin;
    $("duration").textContent = CONFIG.duration;
    $("baggage").textContent = CONFIG.baggage;
    $("message").textContent = CONFIG.message;
    $("from").textContent = CONFIG.from;
    $("companion").textContent = CONFIG.companion;
    $("companion-seat").textContent = CONFIG.companionSeat;
    $("code-text").textContent = CONFIG.code;
    $("notes").innerHTML = "";
    CONFIG.notes.forEach((n) => { const li = document.createElement("li"); li.textContent = n; $("notes").appendChild(li); });
    drawBarcode(CONFIG.code);
  }

  // 依訂位代號產生裝飾用條碼
  function drawBarcode(text) {
    const svg = $("barcode");
    svg.innerHTML = "";
    let seed = 0;
    for (const c of text) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
    let x = 0;
    while (x < 92) {
      seed = (seed * 1103515245 + 12345) >>> 0;
      const w = 1 + (seed >>> 16) % 3;
      const gap = 1 + (seed >>> 20) % 3;
      if (x + w > 92) break;
      const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      r.setAttribute("x", x); r.setAttribute("y", 0);
      r.setAttribute("width", w); r.setAttribute("height", 64);
      svg.appendChild(r);
      x += w + gap;
    }
  }

  // 小飛機沿弧線飛行
  function flyPlane() {
    const track = $("track"), plane = $("plane");
    const len = track.getTotalLength();
    const place = (t) => {
      const d = len * t;
      const p = track.getPointAtLength(d);
      // 取前後兩點算切線角度，起點與終點也能正確轉向
      const p0 = track.getPointAtLength(Math.max(0, d - 1));
      const p1 = track.getPointAtLength(Math.min(len, d + 1));
      const a = Math.atan2(p1.y - p0.y, p1.x - p0.x) * 180 / Math.PI;
      plane.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${a})`);
    };
    if (reduceMotion) { place(1); return; }
    const dur = 2200; let start;
    const step = (ts) => {
      if (!start) start = ts;
      const k = Math.min(1, (ts - start) / dur);
      const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      place(e);
      if (k < 1) requestAnimationFrame(step);
    };
    place(0);
    requestAnimationFrame(step);
  }


  /* ===== 背景主題 ===== */
  // 底片顆粒（lofi）
  function noiseTile(size) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");
    const img = ctx.createImageData(size, size);
    for (let i = 0; i < img.data.length; i += 4) {
      const dark = Math.random() < .5;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = dark ? 40 : 255;
      img.data[i + 3] = Math.random() * (dark ? 20 : 12);
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }

  /* ===== WebGL 雲 =====
     著色器移植自 drift 的「2D Clouds」（https://www.shadertoy.com/view/4tdSWr），
     以 CC BY-NC-SA 3.0 授權；本段著色器沿用相同授權。配色與參數為本頁調整。 */
  const GL_THEMES = {
    // lofi：褪色藍天、灰白雲（維持原本色調）
    lofi: { skyTop: [.56, .70, .79], skyBottom: [.83, .88, .91],
            shadow: [0, 0, 0], mid: [.561, .561, .539], hi: [1.02, 1.02, .98],
            dark: .5, light: .3, cover: .2, alpha: 8., skytint: .5, scale: 1.1, speed: .0095, res: .5 },
    // pink：依 Lover 色盤，寶寶藍天空 #76BAE0、粉嫩粉紅 #EBBED3、奶油黃 #FFF5CC 亮面、藕紫暗面
    pink: { skyTop: [.463, .729, .878], skyBottom: [.74, .87, .94],
            shadow: [.66, .44, .54], mid: [.95, .73, .80], hi: [1.0, .955, .80],
            dark: .5, light: .32, cover: .2, alpha: 8., skytint: .08, scale: 1.1, speed: .0095, res: .5 }
  };

  const GL_FRAG = `
  #ifdef GL_FRAGMENT_PRECISION_HIGH
  precision highp float;
  #else
  precision mediump float;
  #endif
  uniform vec2 iResolution;
  uniform float iTime;
  uniform float cloudscale, speed, clouddark, cloudlight, cloudcover, cloudalpha, skytint;
  uniform vec3 skycolour1, skycolour2, cloudshadow, cloudmid, cloudhi;
  const mat2 m = mat2(1.6, 1.2, -1.2, 1.6);

  vec2 hash(vec2 p) {
    p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
    return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
  }
  float noise(in vec2 p) {
    const float K1 = 0.366025404;
    const float K2 = 0.211324865;
    vec2 i = floor(p + (p.x + p.y) * K1);
    vec2 a = p - i + (i.x + i.y) * K2;
    vec2 o = (a.x > a.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec2 b = a - o + K2;
    vec2 c = a - 1.0 + 2.0 * K2;
    vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
    vec3 n = h * h * h * h * vec3(dot(a, hash(i + 0.0)), dot(b, hash(i + o)), dot(c, hash(i + 1.0)));
    return dot(n, vec3(70.0));
  }
  float fbm(vec2 n) {
    float total = 0.0, amplitude = 0.1;
    for (int i = 0; i < 7; i++) { total += noise(n) * amplitude; n = m * n; amplitude *= 0.4; }
    return total;
  }

  void main() {
    vec2 dd;  // 每層細節的額外位移（在畫面上為純水平）
    vec2 p = gl_FragCoord.xy / iResolution.xy;
    vec2 base = p * vec2(iResolution.x / iResolution.y, 1.0);
    float time = iTime * speed;
    float q = fbm(base * cloudscale * 0.5);

    // 雲的輪廓（脊狀雜訊）
    float r = 0.0;
    vec2 uv = base * cloudscale;
    uv += q + vec2(time, 0.0);
    float weight = 0.8;
    dd = vec2(time * 0.5, 0.0);
    for (int i = 0; i < 8; i++) { r += abs(weight * noise(uv)); dd = m * dd; uv = m * uv + dd; weight *= 0.7; }

    // 雲的形狀
    float f = 0.0;
    uv = base * cloudscale;
    uv += q + vec2(time, 0.0);
    weight = 0.7;
    dd = vec2(time * 0.5, 0.0);
    for (int i = 0; i < 8; i++) { f += weight * noise(uv); dd = m * dd; uv = m * uv + dd; weight *= 0.6; }
    f *= r + f;

    // 雲的明暗
    float c = 0.0;
    time = iTime * speed * 2.0;
    uv = base * cloudscale * 2.0;
    uv += q + vec2(time, 0.0);
    weight = 0.4;
    dd = vec2(time * 0.5, 0.0);
    for (int i = 0; i < 7; i++) { c += weight * noise(uv); dd = m * dd; uv = m * uv + dd; weight *= 0.6; }

    float c1 = 0.0;
    time = iTime * speed * 3.0;
    uv = base * cloudscale * 3.0;
    uv += q + vec2(time, 0.0);
    weight = 0.4;
    dd = vec2(time * 0.5, 0.0);
    for (int i = 0; i < 7; i++) { c1 += abs(weight * noise(uv)); dd = m * dd; uv = m * uv + dd; weight *= 0.6; }
    c += c1;

    vec3 skycolour = mix(skycolour2, skycolour1, p.y);
    // 雲的明暗套三段漸層：暗面 → 主色 → 亮面
    float shade = clamp((clouddark + cloudlight * c), 0.0, 1.0);
    vec3 cloudcolour = shade < 0.55
      ? mix(cloudshadow, cloudmid, shade / 0.55)
      : mix(cloudmid, cloudhi, (shade - 0.55) / 0.45);
    f = cloudcover + cloudalpha * f * r;
    vec3 result = mix(skycolour, clamp(skytint * skycolour + cloudcolour, 0.0, 1.0), clamp(f + c, 0.0, 1.0));
    gl_FragColor = vec4(result, 1.0);
  }`;

  function buildWebGLClouds(sky, name) {
    const T = GL_THEMES[name];
    const canvas = document.createElement("canvas");
    canvas.className = "gl-sky";
    const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
    if (!gl) return false;
    const sh = (type, src) => {
      const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(o)); return null; }
      return o;
    };
    const vs = sh(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }");
    const fs = sh(gl.FRAGMENT_SHADER, GL_FRAG);
    if (!vs || !fs) return false;
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const U = (n) => gl.getUniformLocation(prog, n);
    gl.uniform1f(U("cloudscale"), T.scale);
    gl.uniform1f(U("speed"), T.speed);
    gl.uniform1f(U("clouddark"), T.dark);
    gl.uniform1f(U("cloudlight"), T.light);
    gl.uniform1f(U("cloudcover"), T.cover);
    gl.uniform1f(U("cloudalpha"), T.alpha);
    gl.uniform1f(U("skytint"), T.skytint);
    gl.uniform3fv(U("skycolour1"), T.skyTop);
    gl.uniform3fv(U("skycolour2"), T.skyBottom);
    gl.uniform3fv(U("cloudshadow"), T.shadow);
    gl.uniform3fv(U("cloudmid"), T.mid);
    gl.uniform3fv(U("cloudhi"), T.hi);
    const uRes = U("iResolution"), uTime = U("iTime");

    // 以較低解析度計算再放大：雲本來就柔和，手機也省電
    // 尺寸取背景層（固定為最大可視高度），Safari 工具列伸縮不會觸發重設
    let lastW = 0, lastH = 0;
    function resize() {
      const w = sky.clientWidth || innerWidth, h = sky.clientHeight || innerHeight;
      if (w === lastW && h === lastH) return false;
      lastW = w; lastH = h;
      canvas.width = Math.max(1, Math.round(w * T.res));
      canvas.height = Math.max(1, Math.round(h * T.res));
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
      return true;
    }
    const t0 = performance.now() - 20000 - Math.random() * 60000; // 每次打開的雲都不一樣
    const draw = (now) => { gl.uniform1f(uTime, (now - t0) / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3); };
    resize();
    addEventListener("resize", () => { if (resize()) draw(performance.now()); });
    sky.prepend(canvas);
    draw(performance.now());
    if (!reduceMotion) {
      const loop = (now) => { draw(now); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    return true;
  }

  const theme = document.documentElement.dataset.theme;
  if (theme === "lofi") $("grain").style.backgroundImage = `url(${noiseTile(160)})`;
  // WebGL 不支援時，自動改用普通版的雲層圖
  if (document.documentElement.dataset.gl && !buildWebGLClouds($("sky"), theme)) {
    delete document.documentElement.dataset.gl;
  }
  // 3D 飛機：只有網址加 &fly 才載入 three.js 與飛機模型
  if (document.documentElement.dataset.fly) {
    import("./fly.js").then((m) => { window.__fly = m.start($("sky"), theme); })
      .catch((e) => console.warn("3D 飛機載入失敗", e));
  }

  fill();
  flyPlane();
</script>
</body>
</html>
